<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background Elements -->
  <circle cx="200" cy="150" r="120" fill="currentColor" opacity="0.03"/>
  <circle cx="320" cy="80" r="40" fill="currentColor" opacity="0.05"/>
  <circle cx="80" cy="220" r="30" fill="currentColor" opacity="0.04"/>

  <!-- Book Stack -->
  <g transform="translate(80, 120)">
    <!-- Bottom book -->
    <rect x="0" y="80" width="120" height="20" rx="3" fill="currentColor" opacity="0.15"/>
    <!-- Middle book -->
    <rect x="5" y="55" width="110" height="20" rx="3" fill="currentColor" opacity="0.2"/>
    <!-- Top book (open) -->
    <path d="M10 50 Q60 40 60 50 L60 10 Q60 0 10 10 Z" fill="currentColor" opacity="0.25"/>
    <path d="M110 50 Q60 40 60 50 L60 10 Q60 0 110 10 Z" fill="currentColor" opacity="0.2"/>
    <!-- Book lines -->
    <line x1="20" y1="20" x2="50" y2="18" stroke="currentColor" opacity="0.3" stroke-width="2"/>
    <line x1="20" y1="28" x2="45" y2="26" stroke="currentColor" opacity="0.3" stroke-width="2"/>
    <line x1="70" y1="18" x2="100" y2="20" stroke="currentColor" opacity="0.3" stroke-width="2"/>
    <line x1="75" y1="26" x2="100" y2="28" stroke="currentColor" opacity="0.3" stroke-width="2"/>
  </g>

  <!-- Floating Quiz Card -->
  <g transform="translate(220, 60)">
    <rect x="0" y="0" width="140" height="100" rx="12" fill="currentColor" opacity="0.08" stroke="currentColor" stroke-opacity="0.15" stroke-width="1"/>
    <!-- Question mark -->
    <circle cx="30" cy="30" r="15" fill="currentColor" opacity="0.15"/>
    <text x="30" y="36" text-anchor="middle" fill="currentColor" opacity="0.4" font-size="18" font-weight="bold">?</text>
    <!-- Lines -->
    <rect x="55" y="22" width="70" height="6" rx="3" fill="currentColor" opacity="0.12"/>
    <rect x="55" y="34" width="50" height="6" rx="3" fill="currentColor" opacity="0.08"/>
    <!-- Options -->
    <rect x="15" y="55" width="110" height="12" rx="6" fill="currentColor" opacity="0.15"/>
    <rect x="15" y="75" width="110" height="12" rx="6" fill="currentColor" opacity="0.08"/>
  </g>

  <!-- Pencil -->
  <g transform="translate(280, 180) rotate(-30)">
    <rect x="0" y="0" width="80" height="12" rx="2" fill="currentColor" opacity="0.2"/>
    <polygon points="80,0 80,12 95,6" fill="currentColor" opacity="0.3"/>
    <rect x="0" y="0" width="15" height="12" rx="2" fill="currentColor" opacity="0.15"/>
  </g>

  <!-- Lightbulb (idea) -->
  <g transform="translate(320, 140)">
    <circle cx="20" cy="20" r="18" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-opacity="0.2" stroke-width="1"/>
    <path d="M14 35 L14 40 Q14 44 20 44 Q26 44 26 40 L26 35" fill="currentColor" opacity="0.15"/>
    <path d="M12 22 Q12 10 20 10 Q28 10 28 22 Q28 28 24 30 L24 35 L16 35 L16 30 Q12 28 12 22" fill="currentColor" opacity="0.2"/>
    <!-- Light rays -->
    <line x1="20" y1="-5" x2="20" y2="0" stroke="currentColor" opacity="0.2" stroke-width="2"/>
    <line x1="35" y1="5" x2="40" y2="2" stroke="currentColor" opacity="0.2" stroke-width="2"/>
    <line x1="5" y1="5" x2="0" y2="2" stroke="currentColor" opacity="0.2" stroke-width="2"/>
  </g>

  <!-- Graduation Cap -->
  <g transform="translate(60, 60)">
    <polygon points="30,10 0,25 30,40 60,25" fill="currentColor" opacity="0.2"/>
    <rect x="25" y="25" width="10" height="20" fill="currentColor" opacity="0.15"/>
    <circle cx="30" cy="45" r="3" fill="currentColor" opacity="0.2"/>
    <line x1="30" y1="45" x2="30" y2="55" stroke="currentColor" opacity="0.2" stroke-width="2"/>
    <circle cx="30" cy="58" r="4" fill="currentColor" opacity="0.15"/>
  </g>

  <!-- Stars/Sparkles -->
  <g fill="currentColor" opacity="0.25">
    <polygon points="170,40 172,46 178,46 173,50 175,56 170,52 165,56 167,50 162,46 168,46" />
    <polygon points="350,200 351,204 355,204 352,207 353,211 350,208 347,211 348,207 345,204 349,204" transform="scale(0.8)"/>
    <polygon points="100,180 101,184 105,184 102,187 103,191 100,188 97,191 98,187 95,184 99,184" transform="scale(0.7)"/>
  </g>

  <!-- Checkmark badge -->
  <g transform="translate(180, 200)">
    <circle cx="20" cy="20" r="18" fill="currentColor" opacity="0.12"/>
    <path d="M12 20 L17 25 L28 14" stroke="currentColor" opacity="0.3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
